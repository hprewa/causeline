name: value
description: What is the number? A KPI's value in a period, against what that period should have been.
inputs:
  metric:   { type: string }
  period:   { type: string, default: "" }   # a bucket at the top time level, e.g. 2026-W10 ...
  start_date: { type: string, default: "" } # ... or a range of whole days (YYYY-MM-DD, both inclusive)
  end_date:   { type: string, default: "" }
  aggregation: { type: string, default: "" } # the time level to start looking at inside the range (default: the second level)
  baseline: { type: int, default: 4 } # periods to compare against
steps:
  - id: data_check
    compute: coverage_and_counts       # stop if data is incomplete
  - id: headline
    compute: change_vs_baseline        # value, expected value, change and whether it is real
output: result.json
