name: compare
description: A against B. Two periods, or two values of one concept (two teams, two queues), side by side.
inputs:
  metric:  { type: string }
  period:   { type: string, default: "" }   # a bucket at the top time level, e.g. 2026-W10 ...
  start_date: { type: string, default: "" } # ... or a range of whole days (YYYY-MM-DD, both inclusive)
  end_date:   { type: string, default: "" }
  aggregation: { type: string, default: "" } # the time level to start looking at inside the range (default: the second level)
  against: { type: string, default: "" }   # the second period, to compare two periods
  concept: { type: string, default: "" }   # a hierarchy level or dimension, to compare two of its values
  a:       { type: string, default: "" }
  b:       { type: string, default: "" }
  scope: { type: string, default: "" }   # confine the run to values of concepts: JSON, {"concept": "value"}
  baseline: { type: int, default: 4 }
steps:
  - id: data_check
    compute: coverage_and_counts
  - id: compare
    compute: compare
output: result.json
