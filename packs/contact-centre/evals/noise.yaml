# The noise suite (build guide, Phase 0). Every week's service level moves by a random amount (sd 2 points) for each team or each queue
# on its own, the way real data does. Part 1: nothing is planted, so any finding is a false alarm. Part 2: a real fault is planted on top
# of the same wobble and must still be found, so a fix for part 1 cannot simply go deaf.
# Not part of `npm run eval`: run it with `npm run eval:noise` (slow). A case marked `gap` fails today; the marker comes off when it passes.
# The handle-time cases carry the same wobble in the data, which moves service level and not handle time: they check that noise in one
# KPI raises nothing in another.

# Part 1: quiet weeks, 20 seeds for each grouping and KPI

- id: quiet_team_service_level_s301
  setup: "--seed 301 --fault noisy_rate:0.02:team"
  question: "Did anything unusual happen to service level in week 6?"
  inputs: { metric: service_level, period: 2026-W06 }
  expect:
    no_findings: true

