# Part 2: the same wobble with a real fault planted; the fault must still be found. The outage is planted on Wednesday 11 February from
# 12:00 to 14:00 (the half hours 12:00 to 13:30); with the wobble its edges move, so a finding anywhere inside that stretch counts.

- id: understaffed_with_noisy_team_s401
  setup: "--seed 401 --fault noisy_rate:0.02:team --fault understaffed:team_05:wk7"
  question: "Why did service level drop in week 7?"
  inputs: { metric: service_level, period: 2026-W07 }
  expect:
    findings_include: [{ dimension: team, value: team_05 }]

