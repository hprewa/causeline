  FROM (SELECT CAST(strftime('%d', "ts") AS TEXT) AS slot, date("ts") AS inst, SUM((1)) AS t, COUNT(*) AS n_rows
        FROM (SELECT c.call_id, c.ts, a.centre, a.site, a.team, c.agent, c.queue, c.call_reason,
