         c.answered_within_20s, c.handle_seconds, c.is_holiday, c.is_peak
  FROM calls c LEFT JOIN agents a USING (agent)) AS "calls" WHERE "ts" BETWEEN ? AND ? GROUP BY 1, 2)
  GROUP BY slot ORDER BY slot;
---
kind: tool
name: calls_offered_seasonal_day_of_month
