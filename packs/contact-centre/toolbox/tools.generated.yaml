kind: tool
name: service_level_series
type: sqlite-sql
source: contact-centre-db
description: service_level numerator and denominator per time bucket between start and end, at the time level named by aggregation (week, day, interval_30m), with each bucket's first and last timestamp; optionally confined to one value of any concept.
parameters:
  - name: start
    type: string
    description: Start of the range, inclusive, as a timestamp string.
  - name: end
    type: string
    description: End of the range, inclusive, as a timestamp string.
  - name: aggregation
    type: string
    description: "The time level to bucket by: one of week, day, interval_30m."
  - name: centre
    type: string
    description: Restrict the rows to this centre. Empty for no restriction.
    required: false
    default: ""
  - name: site
    type: string
    description: Restrict the rows to this site. Empty for no restriction.
    required: false
    default: ""
  - name: team
    type: string
    description: Restrict the rows to this team. Empty for no restriction.
    required: false
    default: ""
  - name: agent
    type: string
    description: Restrict the rows to this agent. Empty for no restriction.
    required: false
    default: ""
  - name: queue
    type: string
    description: Restrict the rows to this queue. Empty for no restriction.
    required: false
    default: ""
  - name: call_reason
    type: string
    description: Restrict the rows to this call_reason. Empty for no restriction.
    required: false
    default: ""
statement: |
  WITH p AS (SELECT ? AS start_ts, ? AS end_ts, ? AS aggregation, ? AS f_centre, ? AS f_site, ? AS f_team, ? AS f_agent, ? AS f_queue, ? AS f_call_reason)
  SELECT CASE p.aggregation WHEN 'week' THEN strftime('%Y-W%W', "ts") WHEN 'day' THEN strftime('%Y-%m-%d', "ts") WHEN 'interval_30m' THEN strftime('%Y-%m-%d %H', ts) || ':' || CASE WHEN CAST(strftime('%M', ts) AS INTEGER) < 30 THEN '00' ELSE '30' END END AS bucket, MIN("ts") AS bucket_start, MAX("ts") AS bucket_end,
    COALESCE(SUM((answered_within_20s)), 0) AS num, COALESCE(SUM((1)), 0) AS den, COALESCE(SUM((answered_within_20s) * (answered_within_20s)), 0) AS sq, CASE WHEN MIN(strftime('%w', "ts")) = MAX(strftime('%w', "ts")) THEN MIN(strftime('%w', "ts")) END AS slot_weekday, CASE WHEN MIN(strftime('%H', "ts")) = MAX(strftime('%H', "ts")) THEN MIN(strftime('%H', "ts")) END AS slot_hour_of_day, CASE WHEN MIN(is_holiday) = MAX(is_holiday) THEN MIN(is_holiday) END AS slot_is_holiday, CASE WHEN MIN(is_peak) = MAX(is_peak) THEN MIN(is_peak) END AS slot_is_peak
  FROM (SELECT c.call_id, c.ts, a.centre, a.site, a.team, c.agent, c.queue, c.call_reason,
         c.answered_within_20s, c.handle_seconds, c.is_holiday, c.is_peak
  FROM calls c LEFT JOIN agents a USING (agent)) AS "calls", p WHERE "ts" BETWEEN p.start_ts AND p.end_ts AND (p.f_centre = '' OR "centre" = p.f_centre) AND (p.f_site = '' OR "site" = p.f_site) AND (p.f_team = '' OR "team" = p.f_team) AND (p.f_agent = '' OR "agent" = p.f_agent) AND (p.f_queue = '' OR "queue" = p.f_queue) AND (p.f_call_reason = '' OR "call_reason" = p.f_call_reason)
  GROUP BY 1 ORDER BY bucket_start;
