kind: tool
name: calls_check_nulls
type: sqlite-sql
source: contact-centre-db
description: Row count and the number of NULLs in every column the ontology uses (time, concepts, calendar flags).
parameters: []
statement: |
  SELECT COUNT(*) AS n_rows, COALESCE(SUM("ts" IS NULL), 0) AS "ts", COALESCE(SUM("centre" IS NULL), 0) AS "centre", COALESCE(SUM("site" IS NULL), 0) AS "site", COALESCE(SUM("team" IS NULL), 0) AS "team", COALESCE(SUM("agent" IS NULL), 0) AS "agent", COALESCE(SUM("queue" IS NULL), 0) AS "queue", COALESCE(SUM("call_reason" IS NULL), 0) AS "call_reason" FROM (SELECT c.call_id, c.ts, a.centre, a.site, a.team, c.agent, c.queue, c.call_reason,
         c.answered_within_20s, c.handle_seconds, c.is_holiday, c.is_peak
  FROM calls c LEFT JOIN agents a USING (agent)) AS "calls";
