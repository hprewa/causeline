    COALESCE(SUM(CASE WHEN "ts" BETWEEN p.base_s AND p.base_e AND (p.s_weekday = '' OR instr(',' || p.s_weekday || ',', ',' || CAST(strftime('%w', "ts") AS TEXT) || ',') > 0) AND (p.s_hour_of_day = '' OR instr(',' || p.s_hour_of_day || ',', ',' || CAST(strftime('%H', "ts") AS TEXT) || ',') > 0) AND (p.s_is_holiday = '' OR instr(',' || p.s_is_holiday || ',', ',' || CAST(is_holiday AS TEXT) || ',') > 0) AND (p.s_is_peak = '' OR instr(',' || p.s_is_peak || ',', ',' || CAST(is_peak AS TEXT) || ',') > 0) THEN 1 END), 0) AS base_den,
    COALESCE(SUM(CASE WHEN "ts" BETWEEN p.base_s AND p.base_e AND (p.s_weekday = '' OR instr(',' || p.s_weekday || ',', ',' || CAST(strftime('%w', "ts") AS TEXT) || ',') > 0) AND (p.s_hour_of_day = '' OR instr(',' || p.s_hour_of_day || ',', ',' || CAST(strftime('%H', "ts") AS TEXT) || ',') > 0) AND (p.s_is_holiday = '' OR instr(',' || p.s_is_holiday || ',', ',' || CAST(is_holiday AS TEXT) || ',') > 0) AND (p.s_is_peak = '' OR instr(',' || p.s_is_peak || ',', ',' || CAST(is_peak AS TEXT) || ',') > 0) THEN (1) * (1) END), 0) AS base_sq
  FROM (SELECT c.call_id, c.ts, a.centre, a.site, a.team, c.agent, c.queue, c.call_reason,
         c.answered_within_20s, c.handle_seconds, c.is_holiday, c.is_peak
  FROM calls c LEFT JOIN agents a USING (agent)) AS "calls", p
  WHERE ("ts" BETWEEN p.cur_s AND p.cur_e AND (p.s_is_holiday = '' OR instr(',' || p.s_is_holiday || ',', ',' || CAST(is_holiday AS TEXT) || ',') > 0) AND (p.s_is_peak = '' OR instr(',' || p.s_is_peak || ',', ',' || CAST(is_peak AS TEXT) || ',') > 0) OR ("ts" BETWEEN p.base_s AND p.base_e AND (p.s_weekday = '' OR instr(',' || p.s_weekday || ',', ',' || CAST(strftime('%w', "ts") AS TEXT) || ',') > 0) AND (p.s_hour_of_day = '' OR instr(',' || p.s_hour_of_day || ',', ',' || CAST(strftime('%H', "ts") AS TEXT) || ',') > 0) AND (p.s_is_holiday = '' OR instr(',' || p.s_is_holiday || ',', ',' || CAST(is_holiday AS TEXT) || ',') > 0) AND (p.s_is_peak = '' OR instr(',' || p.s_is_peak || ',', ',' || CAST(is_peak AS TEXT) || ',') > 0))) AND (p.f_centre = '' OR "centre" = p.f_centre) AND (p.f_site = '' OR "site" = p.f_site) AND (p.f_team = '' OR "team" = p.f_team) AND (p.f_agent = '' OR "agent" = p.f_agent) AND (p.f_queue = '' OR "queue" = p.f_queue)
  GROUP BY "call_reason" ORDER BY "call_reason";
---
kind: tool
name: service_level_seasonal_weekday
type: sqlite-sql
source: contact-centre-db
description: service_level components by position in the weekday cycle between start and end, with the number of occurrences of each position, to test whether it is seasonal.
parameters:
  - name: start
    type: string
    description: Start of the range, inclusive, as a timestamp string.
  - name: end
    type: string
    description: End of the range, inclusive, as a timestamp string.
statement: |
  SELECT CAST(strftime('%w', "ts") AS TEXT) AS slot, COUNT(DISTINCT date("ts")) AS instances,
    COALESCE(SUM((answered_within_20s)), 0) AS num, COALESCE(SUM((1)), 0) AS den, COALESCE(SUM((answered_within_20s) * (answered_within_20s)), 0) AS sq
  FROM (SELECT c.call_id, c.ts, a.centre, a.site, a.team, c.agent, c.queue, c.call_reason,
         c.answered_within_20s, c.handle_seconds, c.is_holiday, c.is_peak
  FROM calls c LEFT JOIN agents a USING (agent)) AS "calls" WHERE "ts" BETWEEN ? AND ?
  GROUP BY 1 ORDER BY 1;
