kind: tool
name: check_values_calls_offered
type: sqlite-sql
source: contact-centre-db
description: "calls_offered: NULLs, minimum and maximum of its numerator and denominator over the whole fact."
parameters: []
statement: |
  SELECT COUNT(*) AS n_rows, COALESCE(SUM((1) IS NULL), 0) AS num_nulls, MIN((1)) AS num_min, MAX((1)) AS num_max,
    COALESCE(SUM(1 IS NULL), 0) AS den_nulls, MIN(1) AS den_min, MAX(1) AS den_max
  FROM (SELECT c.call_id, c.ts, a.centre, a.site, a.team, c.agent, c.queue, c.call_reason,
         c.answered_within_20s, c.handle_seconds, c.is_holiday, c.is_peak
  FROM calls c LEFT JOIN agents a USING (agent)) AS "calls";
---
kind: tool
name: calls_check_parent_site
type: sqlite-sql
source: contact-centre-db
description: "Hierarchy org: how many site values sit under more than one centre (a child must have a single parent), with examples."
parameters: []
statement: |
  SELECT (SELECT COUNT(*) FROM (SELECT 1 FROM (SELECT c.call_id, c.ts, a.centre, a.site, a.team, c.agent, c.queue, c.call_reason,
         c.answered_within_20s, c.handle_seconds, c.is_holiday, c.is_peak
  FROM calls c LEFT JOIN agents a USING (agent)) AS "calls" GROUP BY "site" HAVING COUNT(DISTINCT "centre") > 1)) AS violations,
    (SELECT group_concat(c, ', ') FROM (SELECT "site" AS c FROM (SELECT c.call_id, c.ts, a.centre, a.site, a.team, c.agent, c.queue, c.call_reason,
         c.answered_within_20s, c.handle_seconds, c.is_holiday, c.is_peak
  FROM calls c LEFT JOIN agents a USING (agent)) AS "calls" GROUP BY "site" HAVING COUNT(DISTINCT "centre") > 1 LIMIT 5)) AS examples;
---
