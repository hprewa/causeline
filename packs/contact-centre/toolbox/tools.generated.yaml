kind: tool
name: service_level_extent
type: sqlite-sql
source: contact-centre-db
description: Row count and time extent of the data behind service_level.
parameters: []
statement: |
  SELECT COUNT(*) AS n_rows, MIN("ts") AS min_ts, MAX("ts") AS max_ts FROM (SELECT c.call_id, c.ts, a.centre, a.site, a.team, c.agent, c.queue, c.call_reason,
         c.answered_within_20s, c.handle_seconds, c.is_holiday, c.is_peak
  FROM calls c LEFT JOIN agents a USING (agent)) AS "calls";
