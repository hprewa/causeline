kind: tool
name: orders_shipped_seasonal_weekday
type: sqlite-sql
source: deliveries-db
description: orders_shipped components by position in the weekday cycle between start and end, with the number of occurrences of each position, to test whether it is seasonal.
parameters:
  - name: start
    type: string
    description: Start of the range, inclusive, as a timestamp string.
  - name: end
    type: string
    description: End of the range, inclusive, as a timestamp string.
statement: |
  SELECT slot, COUNT(*) AS instances, COALESCE(SUM(t), 0) AS num, COALESCE(SUM(n_rows), 0) AS den, COALESCE(SUM(t * t), 0) AS sq
  FROM (SELECT CAST(strftime('%w', "shipped_at") AS TEXT) AS slot, date("shipped_at") AS inst, SUM((1)) AS t, COUNT(*) AS n_rows
        FROM (SELECT order_id, shipped_at, warehouse, carrier, region, delivered_on_time, delivery_hours, order_value
  FROM orders) AS "orders" WHERE "shipped_at" BETWEEN ? AND ? GROUP BY 1, 2)
  GROUP BY slot ORDER BY slot;
