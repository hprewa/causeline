kind: tool
name: on_time_rate_series
type: sqlite-sql
source: deliveries-db
description: on_time_rate numerator and denominator per time bucket between start and end, at the time level named by aggregation (week, day), with each bucket's first and last timestamp; optionally confined to one value of any concept.
parameters:
  - name: start
    type: string
    description: Start of the range, inclusive, as a timestamp string.
  - name: end
    type: string
    description: End of the range, inclusive, as a timestamp string.
  - name: aggregation
    type: string
    description: "The time level to bucket by: one of week, day."
  - name: warehouse
    type: string
    description: Restrict the rows to this warehouse. Empty for no restriction.
    required: false
    default: ""
  - name: carrier
    type: string
    description: Restrict the rows to this carrier. Empty for no restriction.
    required: false
    default: ""
  - name: region
    type: string
    description: Restrict the rows to this region. Empty for no restriction.
    required: false
    default: ""
statement: |
  WITH p AS (SELECT ? AS start_ts, ? AS end_ts, ? AS aggregation, ? AS f_warehouse, ? AS f_carrier, ? AS f_region)
  SELECT CASE p.aggregation WHEN 'week' THEN strftime('%Y-W%W', "shipped_at") WHEN 'day' THEN strftime('%Y-%m-%d', "shipped_at") END AS bucket, MIN("shipped_at") AS bucket_start, MAX("shipped_at") AS bucket_end,
    COALESCE(SUM((delivered_on_time)), 0) AS num, COALESCE(SUM((1)), 0) AS den, COALESCE(SUM((delivered_on_time) * (delivered_on_time)), 0) AS sq
  FROM (SELECT order_id, shipped_at, warehouse, carrier, region, delivered_on_time, delivery_hours, order_value
  FROM orders) AS "orders", p WHERE "shipped_at" BETWEEN p.start_ts AND p.end_ts AND (p.f_warehouse = '' OR "warehouse" = p.f_warehouse) AND (p.f_carrier = '' OR "carrier" = p.f_carrier) AND (p.f_region = '' OR "region" = p.f_region)
  GROUP BY 1 ORDER BY bucket_start;
