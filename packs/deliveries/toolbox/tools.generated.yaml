kind: tool
name: on_time_rate_seasonal_weekday
type: sqlite-sql
source: deliveries-db
description: on_time_rate components by position in the weekday cycle between start and end, with the number of occurrences of each position, to test whether it is seasonal.
parameters:
  - name: start
    type: string
    description: Start of the range, inclusive, as a timestamp string.
  - name: end
    type: string
    description: End of the range, inclusive, as a timestamp string.
statement: |
  SELECT CAST(strftime('%w', "shipped_at") AS TEXT) AS slot, COUNT(DISTINCT date("shipped_at")) AS instances,
    COALESCE(SUM((delivered_on_time)), 0) AS num, COALESCE(SUM((1)), 0) AS den, COALESCE(SUM((delivered_on_time) * (delivered_on_time)), 0) AS sq
  FROM (SELECT order_id, shipped_at, warehouse, carrier, region, delivered_on_time, delivery_hours, order_value
  FROM orders) AS "orders" WHERE "shipped_at" BETWEEN ? AND ?
  GROUP BY 1 ORDER BY 1;
---
