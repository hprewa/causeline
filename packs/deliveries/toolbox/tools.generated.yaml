name: check_values_on_time_rate
type: sqlite-sql
source: deliveries-db
description: "on_time_rate: NULLs, minimum and maximum of its numerator and denominator over the whole fact."
parameters: []
statement: |
  SELECT COUNT(*) AS n_rows, COALESCE(SUM((delivered_on_time) IS NULL), 0) AS num_nulls, MIN((delivered_on_time)) AS num_min, MAX((delivered_on_time)) AS num_max,
    COALESCE(SUM((1) IS NULL), 0) AS den_nulls, MIN((1)) AS den_min, MAX((1)) AS den_max
  FROM (SELECT order_id, shipped_at, warehouse, carrier, region, delivered_on_time, delivery_hours, order_value
  FROM orders) AS "orders";
