kind: tool
name: on_time_rate_by_warehouse
type: sqlite-sql
source: deliveries-db
description: on_time_rate components for each warehouse, current period vs baseline; optionally confined to one value of any other concept.
parameters:
  - name: cur_start
    type: string
    description: Start of the current period, inclusive, as a timestamp string.
  - name: cur_end
    type: string
    description: End of the current period, inclusive, as a timestamp string.
