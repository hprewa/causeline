kind: tool
name: orders_check_daily_rows
type: sqlite-sql
source: deliveries-db
description: Rows per calendar day across the fact, to find gaps and days with far fewer rows than usual.
parameters: []
statement: |
  SELECT date("shipped_at") AS day, COUNT(*) AS n_rows FROM (SELECT order_id, shipped_at, warehouse, carrier, region, delivered_on_time, delivery_hours, order_value
  FROM orders) AS "orders" GROUP BY 1 ORDER BY 1;
