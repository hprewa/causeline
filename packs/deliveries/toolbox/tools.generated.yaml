kind: tool
name: on_time_rate_extent
type: sqlite-sql
source: deliveries-db
description: Row count and time extent of the data behind on_time_rate.
parameters: []
statement: |
  SELECT COUNT(*) AS n_rows, MIN("shipped_at") AS min_ts, MAX("shipped_at") AS max_ts FROM (SELECT order_id, shipped_at, warehouse, carrier, region, delivered_on_time, delivery_hours, order_value
  FROM orders) AS "orders";
