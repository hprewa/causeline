    required: false
    default: ""
  - name: region
    type: string
    description: Restrict the rows to this region. Empty for no restriction.
    required: false
    default: ""
statement: |
  WITH p AS (SELECT ? AS cur_s, ? AS cur_e, ? AS base_s, ? AS base_e, ? AS f_carrier, ? AS f_region)
  SELECT "warehouse" AS node,
    COALESCE(SUM(CASE WHEN "shipped_at" BETWEEN p.cur_s AND p.cur_e THEN (delivered_on_time) END), 0) AS cur_num,
    COALESCE(SUM(CASE WHEN "shipped_at" BETWEEN p.cur_s AND p.cur_e THEN (1) END), 0) AS cur_den,
    COALESCE(SUM(CASE WHEN "shipped_at" BETWEEN p.cur_s AND p.cur_e THEN (delivered_on_time) * (delivered_on_time) END), 0) AS cur_sq,
    COALESCE(SUM(CASE WHEN "shipped_at" BETWEEN p.base_s AND p.base_e THEN (delivered_on_time) END), 0) AS base_num,
    COALESCE(SUM(CASE WHEN "shipped_at" BETWEEN p.base_s AND p.base_e THEN (1) END), 0) AS base_den,
    COALESCE(SUM(CASE WHEN "shipped_at" BETWEEN p.base_s AND p.base_e THEN (delivered_on_time) * (delivered_on_time) END), 0) AS base_sq
  FROM (SELECT order_id, shipped_at, warehouse, carrier, region, delivered_on_time, delivery_hours, order_value
  FROM orders) AS "orders", p
