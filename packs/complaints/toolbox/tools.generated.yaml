  SELECT `submitted_via` AS node,
    COALESCE(SUM(CASE WHEN `ts` BETWEEN p.cur_s AND p.cur_e THEN (closed_with_monetary_relief) END), 0) AS cur_num,
    COALESCE(SUM(CASE WHEN `ts` BETWEEN p.cur_s AND p.cur_e THEN (1) END), 0) AS cur_den,
    COALESCE(SUM(CASE WHEN `ts` BETWEEN p.cur_s AND p.cur_e THEN (closed_with_monetary_relief) * (closed_with_monetary_relief) END), 0) AS cur_sq,
    COALESCE(SUM(CASE WHEN `ts` BETWEEN p.base_s AND p.base_e AND (p.s_weekday = '' OR STRPOS(CONCAT(',', p.s_weekday, ','), CONCAT(',', CAST(FORMAT_TIMESTAMP('%w', `ts`) AS STRING), ',')) > 0) THEN (closed_with_monetary_relief) END), 0) AS base_num,
    COALESCE(SUM(CASE WHEN `ts` BETWEEN p.base_s AND p.base_e AND (p.s_weekday = '' OR STRPOS(CONCAT(',', p.s_weekday, ','), CONCAT(',', CAST(FORMAT_TIMESTAMP('%w', `ts`) AS STRING), ',')) > 0) THEN (1) END), 0) AS base_den,
    COALESCE(SUM(CASE WHEN `ts` BETWEEN p.base_s AND p.base_e AND (p.s_weekday = '' OR STRPOS(CONCAT(',', p.s_weekday, ','), CONCAT(',', CAST(FORMAT_TIMESTAMP('%w', `ts`) AS STRING), ',')) > 0) THEN (closed_with_monetary_relief) * (closed_with_monetary_relief) END), 0) AS base_sq
  FROM (SELECT TIMESTAMP(date_received) AS ts,
         product,
         CONCAT(product, ' / ', COALESCE(subproduct, 'not given')) AS subproduct,
         issue,
         CONCAT(issue, ' / ', COALESCE(subissue, 'not given')) AS subissue,
         company_name,
         state,
         submitted_via,
         CAST(timely_response AS INT64) AS timely_response,
         IF(company_response_to_consumer = 'Closed with monetary relief', 1, 0) AS closed_with_monetary_relief
  FROM `bigquery-public-data.cfpb_complaints.complaint_database`
  WHERE date_received <= DATE '2023-02-12') AS `complaints`, p
  WHERE (`ts` BETWEEN p.cur_s AND p.cur_e OR (`ts` BETWEEN p.base_s AND p.base_e AND (p.s_weekday = '' OR STRPOS(CONCAT(',', p.s_weekday, ','), CONCAT(',', CAST(FORMAT_TIMESTAMP('%w', `ts`) AS STRING), ',')) > 0))) AND (p.f_product = '' OR `product` = p.f_product) AND (p.f_subproduct = '' OR `subproduct` = p.f_subproduct) AND (p.f_issue = '' OR `issue` = p.f_issue) AND (p.f_subissue = '' OR `subissue` = p.f_subissue) AND (p.f_company_name = '' OR `company_name` = p.f_company_name) AND (p.f_state = '' OR `state` = p.f_state)
