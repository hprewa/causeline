kind: tool
name: timely_response_rate_series
type: bigquery-sql
source: complaints-bq
description: timely_response_rate numerator and denominator per time bucket between start and end, at the time level named by aggregation (week, day), with each bucket's first and last timestamp; optionally confined to one value of any concept.
parameters:
  - name: start
    type: string
    description: Start of the range, inclusive, as a timestamp string.
  - name: end
    type: string
    description: End of the range, inclusive, as a timestamp string.
  - name: aggregation
    type: string
    description: "The time level to bucket by: one of week, day."
  - name: product
    type: string
    description: Restrict the rows to this product. Empty for no restriction.
    required: false
    default: ""
  - name: subproduct
    type: string
    description: Restrict the rows to this subproduct. Empty for no restriction.
    required: false
    default: ""
  - name: issue
