         IF(company_response_to_consumer = 'Closed with monetary relief', 1, 0) AS closed_with_monetary_relief
  FROM `bigquery-public-data.cfpb_complaints.complaint_database`
  WHERE date_received <= DATE '2023-02-12') AS `complaints` GROUP BY 1 ORDER BY 1;
---
kind: tool
name: complaints_check_daily_rows
type: bigquery-sql
source: complaints-bq
description: Rows per calendar day across the fact, to find gaps and days with far fewer rows than usual.
parameters: []
statement: |
  SELECT FORMAT_TIMESTAMP('%Y-%m-%d', `ts`) AS day, COUNT(*) AS n_rows FROM (SELECT TIMESTAMP(date_received) AS ts,
         product,
         CONCAT(product, ' / ', COALESCE(subproduct, 'not given')) AS subproduct,
         issue,
         CONCAT(issue, ' / ', COALESCE(subissue, 'not given')) AS subissue,
         company_name,
         state,
         submitted_via,
         CAST(timely_response AS INT64) AS timely_response,
         IF(company_response_to_consumer = 'Closed with monetary relief', 1, 0) AS closed_with_monetary_relief
  FROM `bigquery-public-data.cfpb_complaints.complaint_database`
  WHERE date_received <= DATE '2023-02-12') AS `complaints` GROUP BY 1 ORDER BY 1;
---
kind: tool
name: complaints_check_nulls
type: bigquery-sql
source: complaints-bq
description: Row count and the number of NULLs in every column the ontology uses (time, concepts, calendar flags).
parameters: []
statement: |
  SELECT COUNT(*) AS n_rows, COUNTIF(`ts` IS NULL) AS `ts`, COUNTIF(`product` IS NULL) AS `product`, COUNTIF(`subproduct` IS NULL) AS `subproduct`, COUNTIF(`issue` IS NULL) AS `issue`, COUNTIF(`subissue` IS NULL) AS `subissue`, COUNTIF(`company_name` IS NULL) AS `company_name`, COUNTIF(`state` IS NULL) AS `state`, COUNTIF(`submitted_via` IS NULL) AS `submitted_via` FROM (SELECT TIMESTAMP(date_received) AS ts,
         product,
         CONCAT(product, ' / ', COALESCE(subproduct, 'not given')) AS subproduct,
         issue,
         CONCAT(issue, ' / ', COALESCE(subissue, 'not given')) AS subissue,
         company_name,
         state,
         submitted_via,
         CAST(timely_response AS INT64) AS timely_response,
         IF(company_response_to_consumer = 'Closed with monetary relief', 1, 0) AS closed_with_monetary_relief
  FROM `bigquery-public-data.cfpb_complaints.complaint_database`
  WHERE date_received <= DATE '2023-02-12') AS `complaints`;
---
kind: tool
name: company_statements
type: bigquery-sql
source: complaints-bq
description: What the company publicly said about the complaint, and the CFPB's tags (older American, servicemember), for the company and product concerned.
parameters:
  - name: start
    type: string
    description: Start of the range, inclusive, as a timestamp string.
  - name: end
    type: string
    description: End of the range, inclusive, as a timestamp string.
  - name: company_name
    type: string
    description: Only records about this company_name. Empty for any.
    required: false
    default: ""
  - name: product
    type: string
    description: Only records about this product. Empty for any.
    required: false
    default: ""
statement: |
  WITH p AS (SELECT TIMESTAMP(@start) AS w_start, TIMESTAMP(@end) AS w_end, @company_name AS `company_name`, @product AS `product`)
  SELECT e.* FROM (SELECT TIMESTAMP(date_received) AS ts,
         product,
         company_name,
         company_public_response,
         tags
  FROM `bigquery-public-data.cfpb_complaints.complaint_database`
  WHERE date_received <= DATE '2023-02-12'
    AND (company_public_response IS NOT NULL OR tags IS NOT NULL)) AS e, p
  WHERE e.`ts` BETWEEN p.w_start AND p.w_end AND (p.`company_name` = '' OR e.`company_name` = p.`company_name`) AND (p.`product` = '' OR e.`product` = p.`product`)
  ORDER BY e.`ts` LIMIT 200;
