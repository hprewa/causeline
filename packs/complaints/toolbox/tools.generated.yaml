    description: Restrict the rows to this subissue. Empty for no restriction.
    required: false
    default: ""
  - name: company_name
    type: string
    description: Restrict the rows to this company_name. Empty for no restriction.
    required: false
    default: ""
  - name: state
    type: string
    description: Restrict the rows to this state. Empty for no restriction.
    required: false
    default: ""
  - name: submitted_via
    type: string
    description: Restrict the rows to this submitted_via. Empty for no restriction.
    required: false
    default: ""
statement: |
  WITH p AS (SELECT TIMESTAMP(@start) AS start_ts, TIMESTAMP(@end) AS end_ts, @aggregation AS aggregation, @product AS f_product, @subproduct AS f_subproduct, @issue AS f_issue, @subissue AS f_subissue, @company_name AS f_company_name, @state AS f_state, @submitted_via AS f_submitted_via)
  SELECT CASE p.aggregation WHEN 'week' THEN FORMAT_TIMESTAMP('%Y-W%W', `ts`) WHEN 'day' THEN FORMAT_TIMESTAMP('%Y-%m-%d', `ts`) END AS bucket, FORMAT_TIMESTAMP('%Y-%m-%d %H:%M:%E*S', MIN(`ts`)) AS bucket_start, FORMAT_TIMESTAMP('%Y-%m-%d %H:%M:%E*S', MAX(`ts`)) AS bucket_end,
    COALESCE(SUM((timely_response)), 0) AS num, COALESCE(SUM((1)), 0) AS den, COALESCE(SUM((timely_response) * (timely_response)), 0) AS sq, CASE WHEN MIN(FORMAT_TIMESTAMP('%w', `ts`)) = MAX(FORMAT_TIMESTAMP('%w', `ts`)) THEN MIN(FORMAT_TIMESTAMP('%w', `ts`)) END AS slot_weekday
  FROM (SELECT TIMESTAMP(date_received) AS ts,
         product,
         CONCAT(product, ' / ', COALESCE(subproduct, 'not given')) AS subproduct,
         issue,
         CONCAT(issue, ' / ', COALESCE(subissue, 'not given')) AS subissue,
         company_name,
         state,
         submitted_via,
         CAST(timely_response AS INT64) AS timely_response,
         IF(company_response_to_consumer = 'Closed with monetary relief', 1, 0) AS closed_with_monetary_relief
  FROM `bigquery-public-data.cfpb_complaints.complaint_database`
  WHERE date_received <= DATE '2023-02-12') AS `complaints`, p WHERE `ts` BETWEEN p.start_ts AND p.end_ts AND (p.f_product = '' OR `product` = p.f_product) AND (p.f_subproduct = '' OR `subproduct` = p.f_subproduct) AND (p.f_issue = '' OR `issue` = p.f_issue) AND (p.f_subissue = '' OR `subissue` = p.f_subissue) AND (p.f_company_name = '' OR `company_name` = p.f_company_name) AND (p.f_state = '' OR `state` = p.f_state) AND (p.f_submitted_via = '' OR `submitted_via` = p.f_submitted_via)
  GROUP BY 1 ORDER BY bucket_start;
