kind: tool
name: complaints_check_parent_subproduct
type: bigquery-sql
source: complaints-bq
description: "Hierarchy product_line: how many subproduct values sit under more than one product (a child must have a single parent), with examples."
parameters: []
statement: |
  SELECT (SELECT COUNT(*) FROM (SELECT 1 FROM (SELECT TIMESTAMP(date_received) AS ts,
         product,
         CONCAT(product, ' / ', COALESCE(subproduct, 'not given')) AS subproduct,
         issue,
         CONCAT(issue, ' / ', COALESCE(subissue, 'not given')) AS subissue,
         company_name,
         state,
         submitted_via,
         CAST(timely_response AS INT64) AS timely_response,
         IF(company_response_to_consumer = 'Closed with monetary relief', 1, 0) AS closed_with_monetary_relief
  FROM `bigquery-public-data.cfpb_complaints.complaint_database`
  WHERE date_received <= DATE '2023-02-12') AS `complaints` GROUP BY `subproduct` HAVING COUNT(DISTINCT `product`) > 1)) AS violations,
    (SELECT STRING_AGG(c, ', ') FROM (SELECT `subproduct` AS c FROM (SELECT TIMESTAMP(date_received) AS ts,
         product,
         CONCAT(product, ' / ', COALESCE(subproduct, 'not given')) AS subproduct,
         issue,
         CONCAT(issue, ' / ', COALESCE(subissue, 'not given')) AS subissue,
         company_name,
         state,
         submitted_via,
         CAST(timely_response AS INT64) AS timely_response,
         IF(company_response_to_consumer = 'Closed with monetary relief', 1, 0) AS closed_with_monetary_relief
  FROM `bigquery-public-data.cfpb_complaints.complaint_database`
  WHERE date_received <= DATE '2023-02-12') AS `complaints` GROUP BY `subproduct` HAVING COUNT(DISTINCT `product`) > 1 LIMIT 5)) AS examples;
