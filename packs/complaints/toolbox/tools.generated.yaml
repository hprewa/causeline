kind: tool
name: timely_response_rate_seasonal_weekday
type: bigquery-sql
source: complaints-bq
description: timely_response_rate components by position in the weekday cycle between start and end, with the number of occurrences of each position, to test whether it is seasonal.
parameters:
  - name: start
    type: string
    description: Start of the range, inclusive, as a timestamp string.
  - name: end
    type: string
    description: End of the range, inclusive, as a timestamp string.
statement: |
  SELECT CAST(FORMAT_TIMESTAMP('%w', `ts`) AS STRING) AS slot, COUNT(DISTINCT FORMAT_TIMESTAMP('%Y-%m-%d', `ts`)) AS instances,
    COALESCE(SUM((timely_response)), 0) AS num, COALESCE(SUM((1)), 0) AS den, COALESCE(SUM((timely_response) * (timely_response)), 0) AS sq
  FROM (SELECT TIMESTAMP(date_received) AS ts,
         product,
         CONCAT(product, ' / ', COALESCE(subproduct, 'not given')) AS subproduct,
         issue,
         CONCAT(issue, ' / ', COALESCE(subissue, 'not given')) AS subissue,
         company_name,
         state,
         submitted_via,
         CAST(timely_response AS INT64) AS timely_response,
         IF(company_response_to_consumer = 'Closed with monetary relief', 1, 0) AS closed_with_monetary_relief
  FROM `bigquery-public-data.cfpb_complaints.complaint_database`
  WHERE date_received <= DATE '2023-02-12') AS `complaints` WHERE `ts` BETWEEN TIMESTAMP(@start) AND TIMESTAMP(@end)
  GROUP BY 1 ORDER BY 1;
