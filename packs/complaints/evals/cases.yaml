# Eval cases for the complaints pack. There is no `setup`: the data is the CFPB's real public table, so these are real events
# in real data, and every case was looked at in the data on its own (weekly counts by company, and the CFPB's published counts)
# before it was written. Where an expected answer rests on what is publicly known, the case says so. Windows are Monday to Sunday,
# given as dates; the data ends on 2023-02-12. Two real incidents the analysis does not yet get right are in known-gaps.md: they are
# kept out of this file so that it says what works, and are put back when they pass.

# 1. known event: the Equifax breach was announced on 7 September 2017. Complaints about Equifax went from about 500 a week to 5,723
#    in the week of 4 September, in credit reporting. The analysis also reports the web channel (nearly every one of those complaints
#    came in by web) and ranks it first by a small margin, so the case asks that Equifax is among the findings, not that it is first.
- id: equifax_breach_volume
  question: "Why did complaint volume jump in the week of 4 September 2017?"
  inputs: { metric: complaint_volume, period: "", more: { start_date: "2017-09-04", end_date: "2017-09-10" } }
  expect:
    findings_include:
      - { dimension: company_name, value: "EQUIFAX, INC." }
      - { dimension: day, value: "2017-09-08..2017-09-09" }

# 2. quiet weeks: three weeks picked before running the analysis, from different years, where nothing is known to have happened and the
#    CFPB's published counts and the table agree. The headline must be within normal variation. (The analysis may still report
#    changes inside a week that cancel out: that is its job and is not asserted either way; see evals/known-gaps.md.)
- id: quiet_week_2019_volume_is_within_normal_variation
  question: "Did complaint volume change in the week of 6 May 2019?"
  inputs: { metric: complaint_volume, period: "", more: { start_date: "2019-05-06", end_date: "2019-05-12" } }
  expect:
    significant: false

- id: quiet_week_2022_march_volume_is_within_normal_variation
  question: "Did complaint volume change in the week of 7 March 2022?"
  inputs: { metric: complaint_volume, period: "", more: { start_date: "2022-03-07", end_date: "2022-03-13" } }
  expect:
    significant: false

- id: quiet_week_2022_november_timely_rate_is_within_normal_variation
  question: "Did the timely response rate change in the week of 7 November 2022?"
  inputs: { metric: timely_response_rate, period: "", more: { start_date: "2022-11-07", end_date: "2022-11-13" } }
  expect:
    significant: false

# 3. a week the data does not hold: the copy was taken in March 2023 and its newest weeks were still filling in, so the pack ends on
#    12 February 2023. The CFPB's own count for 13 to 19 March is 26,270 and the copy holds 17,860 of them: asking about it must stop
#    and say what the data covers, never answer from a part-filled week.
- id: week_after_the_data_ends
  question: "Why did complaint volume change in the week of 13 March 2023?"
  inputs: { metric: complaint_volume, period: "", more: { start_date: "2023-03-13", end_date: "2023-03-19" } }
  expect:
    stopped_reason: period_not_found
    must_mention: ["2023-02-12"]
